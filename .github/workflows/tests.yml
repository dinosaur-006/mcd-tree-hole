name: tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unittest:
    name: unittest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # 零第三方依赖：不装任何包，直接跑
      - name: 运行测试
        run: python tests/test_recall.py -v

      # 顺便验证 unittest 发现机制与直接从任意目录运行两种方式
      - name: 验证其他运行方式
        working-directory: ${{ runner.temp }}
        run: |
          cd "$GITHUB_WORKSPACE"
          python -m unittest discover -s tests -t . -v
          cd "${{ runner.temp }}"
          python "$GITHUB_WORKSPACE/tests/test_recall.py"

  cases:
    name: 判决集
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # 判决集判的是「系统掌握的事实」和「话术的骨架」，不是「它说的话」。
      # 有 FAIL 就退出码非零，这次提交就过不去。
      - name: 判定
        run: python cases/check.py

      # 组装引擎能独立跑通（不依赖判决集）
      - name: 组装引擎
        run: python scripts/compose.py --list-slots

      # 演示脚本也跑一遍：它不该崩，也不该碰到真实档案
      - name: 演示脚本自检
        run: python demo/demo.py --selftest
